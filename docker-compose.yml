services:
  postgres:
    image: postgres:17-alpine
    container_name: mindconnect-db
    environment:
      POSTGRES_DB: mindconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - mindconnect_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mindconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mindconnect_data:
