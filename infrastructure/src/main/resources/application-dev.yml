spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mindconnect?sslmode=disable
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[physical_naming_strategy]": org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        "[default_schema]": mindconnect_schema
        "[format_sql]": true

  flyway: 
    enabled: true
    locations: classpath:db/migration
    create-schemas: true
    init-sqls:
      - CREATE SCHEMA IF NOT EXISTS mindconnect_schema
    schemas:
      - mindconnect_schema
    default-schema: mindconnect_schema
    table: flyway_schema_history_mindconnect
    baseline-on-migrate: true
    baseline-version: 0

queue:
  block-users:
    fixed-delay-ms: 5000

server:
  port: 8081

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
